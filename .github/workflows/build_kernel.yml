name: 🚀 Build K40 Pro Kernel 5.4 (GKI + Clang-15)

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      # 安全内核名（仅 ASCII 字符）
      KERNEL_NAME: "5.4_SukiSUUltra_By_Whiteink_Studio"
      DEVICE: "haydn"
      # ✅ 使用仓库中真实存在的 defconfig
      DEFCONFIG: "vendor/haydn_GKI.config"
      ANYKERNEL_URL: "https://github.com/osm0sis/AnyKernel3"

    steps:
      - name: 📥 Checkout Your Repository
        uses: actions/checkout@v4

      - name: ⚙️ Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex \
            git gnupg libncurses5-dev libssl-dev \
            lzop rsync squashfs-tools xz-utils zip zlib1g-dev \
            python3 clang-15 lld-15 llvm-15

      - name: 🐍 Install Python 2 (Required by Xiaomi Kernel Scripts)
        run: |
          sudo apt install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: 🔧 Set Kernel Build Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Whiteink" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=GitHub" >> $GITHUB_ENV

      - name: 🔍 Verify Defconfig Exists
        run: |
          ls -l arch/arm64/configs/vendor/
          if [ ! -f "arch/arm64/configs/vendor/haydn_GKI.config" ]; then
            echo "❌ haydn_GKI.config not found!"
            exit 1
          fi

      - name: 🧹 Clean & Configure Kernel
        run: |
          make O=out clean
          make O=out mrproper
          make O=out ${{ env.DEFCONFIG }}

      - name: ⚡ Compile Kernel with Clang-15
        run: |
          BUILD_START=$(date +"%s")
          make -j$(nproc --all) O=out \
            CC=clang-15 \
            LD=ld.lld-15 \
            AR=llvm-ar-15 \
            NM=llvm-nm-15 \
            OBJCOPY=llvm-objcopy-15 \
            OBJDUMP=llvm-objdump-15 \
            STRIP=llvm-strip-15 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-${KERNEL_NAME}_GKI"
          BUILD_END=$(date +"%s")
          echo "✅ Kernel built in $((BUILD_END - BUILD_START)) seconds"

      - name: 📤 Copy Kernel Image (Image.gz-dtb)
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            # Fallback: some kernels only output Image.gz
            cat out/arch/arm64/boot/Image.gz > ./Image.gz-dtb
          else
            echo "❌ Kernel image not found!"
            ls out/arch/arm64/boot/
            exit 1
          fi
          ls -lh Image.gz-dtb

      - name: 📦 Package with AnyKernel3
        run: |
          git clone $ANYKERNEL_URL
          cp Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="${KERNEL_NAME}-${DEVICE}.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}
          path: "*.zip"

      - name: 🚀 Create GitHub Release (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          tag_name: v$(date +%Y%m%d)-5.4-GKI
          name: "K40 Pro Kernel 5.4 GKI - $(date +%Y-%m-%d)"
          body: |
            Custom kernel for Redmi K40 Pro (haydn)
            - Built from your repo (`haydn-r-oss`)
            - Config: `${{ env.DEFCONFIG }}`
            - Toolchain: Clang-15
            - Name: `${{ env.KERNEL_NAME }}_GKI`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
