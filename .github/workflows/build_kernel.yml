name: 🚀 Build K40 Pro Kernel 5.4 with Clang-15

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      # 安全内核名：仅使用字母、数字、下划线、点、连字符
      KERNEL_NAME: "5.4_SukiSUUltra_By_Whiteink_Studio"
      DEVICE: "haydn"
      DEFCONFIG: "vendor/haydn_defconfig"   # ← 如果报错，请改为你仓库中的实际路径
      ANYKERNEL_URL: "https://github.com/osm0sis/AnyKernel3"

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Install Dependencies + Clang-15
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex \
            git gnupg libncurses5-dev libssl-dev \
            lzop rsync squashfs-tools xz-utils zip zlib1g-dev \
            python3 clang-15 lld-15 llvm-15

      - name: 🔧 Set Build Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Whiteink" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=GitHub" >> $GITHUB_ENV

      - name: 🔍 Verify Clang-15
        run: |
          clang-15 --version

      - name: 🧹 Clean & Configure Kernel
        run: |
          make O=out clean
          make O=out mrproper
          # 可选：列出所有 defconfig 确认路径（如果失败可取消注释）
          # ls arch/arm64/configs/
          make O=out ${{ env.DEFCONFIG }}

      - name: ⚡ Compile Kernel 5.4 with Clang-15
        run: |
          BUILD_START=$(date +"%s")
          make -j$(nproc --all) O=out \
            CC=clang-15 \
            LD=ld.lld-15 \
            AR=llvm-ar-15 \
            NM=llvm-nm-15 \
            OBJCOPY=llvm-objcopy-15 \
            OBJDUMP=llvm-objdump-15 \
            STRIP=llvm-strip-15 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-${KERNEL_NAME}"
          BUILD_END=$(date +"%s")
          echo "✅ Kernel 5.4 built in $((BUILD_END - BUILD_START)) seconds"

      - name: 📤 Copy Kernel Image
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb
          ls -lh Image.gz-dtb

      - name: 📦 Package with AnyKernel3
        run: |
          git clone $ANYKERNEL_URL
          cp Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="${KERNEL_NAME}-${DEVICE}.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..

      - name: 📤 Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}
          path: |
            *.zip
            Image.gz-dtb

      - name: 🚀 Create GitHub Release (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          tag_name: v$(date +%Y%m%d)-5.4
          name: "K40 Pro Kernel 5.4 - $(date +%Y-%m-%d)"
          body: |
            Custom kernel built with **Clang-15** for Redmi K40 Pro (haydn).
            Name: `${{ env.KERNEL_NAME }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
