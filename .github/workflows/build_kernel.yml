name: 🚀 Build K40 Pro Kernel 5.4 (Official Source)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_NAME: "5.4_SukiSUUltra_By_Whiteink_Studio"
      DEVICE: "haydn"
      DEFCONFIG: "vendor/haydn-perf_defconfig"  # 小米官方路径
      ANYKERNEL_URL: "https://github.com/osm0sis/AnyKernel3"

    steps:
      - name: 📥 Setup Official Kernel Source
        run: |
          git init
          git remote add origin https://github.com/MiCode/Xiaomi_Kernel_OpenSource
          git fetch --depth=1 origin haydn-r-oss
          git checkout FETCH_HEAD
          echo "✅ Checked out haydn-r-oss branch"
          ls arch/arm64/configs/vendor/  # 验证文件存在

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex \
            git gnupg libncurses5-dev libssl-dev \
            lzop rsync squashfs-tools xz-utils zip zlib1g-dev \
            python3 clang-15 lld-15 llvm-15

      - name: 🐍 Install Python 2 (for Xiaomi scripts)
        run: |
          sudo apt install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: 🔧 Set Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Whiteink" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=GitHub" >> $GITHUB_ENV

      - name: 🧹 Clean & Configure
        run: |
          make O=out clean
          make O=out mrproper
          make O=out ${{ env.DEFCONFIG }}

      - name: ⚡ Compile Kernel 5.4 with Clang-15
        run: |
          BUILD_START=$(date +"%s")
          make -j$(nproc --all) O=out \
            CC=clang-15 \
            LD=ld.lld-15 \
            AR=llvm-ar-15 \
            NM=llvm-nm-15 \
            OBJCOPY=llvm-objcopy-15 \
            OBJDUMP=llvm-objdump-15 \
            STRIP=llvm-strip-15 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-${KERNEL_NAME}"
          BUILD_END=$(date +"%s")
          echo "✅ Build time: $((BUILD_END - BUILD_START)) seconds"

      - name: 📤 Copy Kernel Image
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb
          ls -lh Image.gz-dtb

      - name: 📦 Package with AnyKernel3
        run: |
          git clone $ANYKERNEL_URL
          cp Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="${KERNEL_NAME}-${DEVICE}.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}
          path: "*.zip"

      - name: 🚀 Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          tag_name: v$(date +%Y%m%d)-5.4
          name: "K40 Pro Kernel 5.4 - $(date +%Y-%m-%d)"
          body: "Built from official MiCode/haydn-r-oss | Name: `${{ env.KERNEL_NAME }}`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
