name: 🚀 Auto Build Haydn Kernel

on:
  push:
    branches: [ main ]          # 推送到 main 分支时触发
  workflow_dispatch:            # 允许手动触发
  schedule:
    - cron: '0 2 * * 0'       # 每周日 UTC 2:00 自动构建（可选）

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360        # 最多 6 小时

    env:
      KERNEL_NAME: "5.4_SukiSUUltra_By白墨(Whiteink)工作室"     # ←←← 在这里改你的内核名字！
      DEVICE: "haydn"
      DEFCONFIG: "vendor/haydn_defconfig"
      CLANG_VERSION: "r450784c"      # Android 12L Clang
      ANYKERNEL_URL: "https://github.com/osm0sis/AnyKernel3"

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex \
            git gnupg libncurses5-dev libssl-dev \
            lzop rsync squashfs-tools xz-utils zip zlib1g-dev \
            python3 wget

      - name: 📦 Download Clang Toolchain (Cached)
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: toolchain/clang-${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}-v2

      - name: 🛠️ Setup Clang (if not cached)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          cd toolchain
          echo "Downloading Clang ${CLANG_VERSION}..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-release/clang-${CLANG_VERSION}.tar.gz
          mkdir -p clang-${CLANG_VERSION}
          tar -xf clang-${CLANG_VERSION}.tar.gz -C clang-${CLANG_VERSION}
          cd ..

      - name: 🔧 Set Environment
        run: |
          echo "PATH=$(pwd)/toolchain/clang-${CLANG_VERSION}/bin:$PATH" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=GitHub" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=Actions" >> $GITHUB_ENV

      - name: 🧹 Clean & Configure
        run: |
          make O=out clean
          make O=out mrproper
          make O=out ${{ env.DEFCONFIG }}

      - name: ⚡ Compile Kernel with Custom Name
        run: |
          BUILD_START=$(date +"%s")
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-${KERNEL_NAME}-$(date +%Y%m%d)"
          BUILD_END=$(date +"%s")
          echo "✅ Build took $((BUILD_END - BUILD_START)) seconds"

      - name: 📤 Copy Kernel Image
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb
          ls -lh Image.gz-dtb

      - name: 📦 Prepare AnyKernel3 ZIP
        run: |
          git clone $ANYKERNEL_URL
          cp Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 "../${KERNEL_NAME}-${DEVICE}-$(date +%Y%m%d).zip" .
          cd ..

      - name: 📤 Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}-${{ github.run_number }}
          path: |
            *.zip
            Image.gz-dtb

      - name: 🚀 Create GitHub Release (Optional)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          tag_name: v$(date +%Y%m%d)-auto
          name: "Auto Build - $(date +%Y-%m-%d)"
          body: "Automatically built kernel: `${{ env.KERNEL_NAME }}` for `${{ env.DEVICE }}`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
