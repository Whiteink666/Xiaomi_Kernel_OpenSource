name: 🚀 Auto Build Haydn Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # 每周日 UTC 2:00 自动构建（可选）

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_NAME: "5.4_SukiSUUltra_By白墨(Whiteink)工作室"        # ←←← 修改这里自定义内核名
      DEVICE: "haydn"
      DEFCONFIG: "vendor/haydn_defconfig"
      CLANG_VERSION: "r450784c"
      ANYKERNEL_URL: "https://github.com/osm0sis/AnyKernel3"

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex \
            git gnupg libncurses5-dev libssl-dev \
            lzop rsync squashfs-tools xz-utils zip zlib1g-dev \
            python3 wget

      - name: 📦 Cache Clang Toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: toolchain/clang-${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}-v3

      - name: 🛠️ Download & Extract Prebuilt Clang (if not cached)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          cd toolchain
          echo "📥 Downloading Clang ${{ env.CLANG_VERSION }} from GitHub..."
          wget -q --show-progress \
            https://github.com/android-linux-stable/clang/releases/download/${{ env.CLANG_VERSION }}/clang-${{ env.CLANG_VERSION }}.tar.xz \
            -O clang.tar.xz
          mkdir -p clang-${{ env.CLANG_VERSION }}
          tar -xf clang.tar.xz -C clang-${{ env.CLANG_VERSION }} --strip-components=1
          cd ..

      - name: 🔧 Set Build Environment
        run: |
          echo "${{ github.workspace }}/toolchain/clang-${{ env.CLANG_VERSION }}/bin" >> $GITHUB_PATH
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=CI" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=GitHub" >> $GITHUB_ENV

      - name: 🔍 Verify Clang
        run: |
          clang --version

      - name: 🧹 Clean & Configure Kernel
        run: |
          make O=out clean
          make O=out mrproper
          make O=out ${{ env.DEFCONFIG }}

      - name: ⚡ Compile Kernel with Custom Name
        run: |
          BUILD_START=$(date +"%s")
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-${KERNEL_NAME}-$(date +%Y%m%d)"
          BUILD_END=$(date +"%s")
          echo "✅ Kernel built in $((BUILD_END - BUILD_START)) seconds"

      - name: 📤 Copy Kernel Image
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb
          ls -lh Image.gz-dtb

      - name: 📦 Package with AnyKernel3
        run: |
          git clone $ANYKERNEL_URL
          cp Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="${KERNEL_NAME}-${DEVICE}-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP_NAME" .
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          cd ..

      - name: 📤 Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}-${{ github.run_number }}
          path: |
            *.zip
            Image.gz-dtb

      - name: 🚀 Create GitHub Release (on manual trigger or main branch)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          tag_name: v$(date +%Y%m%d)-auto
          name: "Auto Build - $(date +%Y-%m-%d)"
          body: |
            Kernel: `${{ env.KERNEL_NAME }}`  
            Device: `${{ env.DEVICE }}`  
            Built on: $(date)  
            Based on: Xiaomi haydn-r-oss
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
