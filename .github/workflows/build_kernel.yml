name: 🚀 Auto Build Haydn Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      # ⚠️ 安全内核名：仅使用字母、数字、点、下划线、连字符
      KERNEL_NAME: "5.4_SukiSUUltra_By_Whiteink_Studio"
      DEVICE: "haydn"
      DEFCONFIG: "vendor/haydn_defconfig"
      CLANG_VERSION: "r450784c"
      ANYKERNEL_URL: "https://github.com/osm0sis/AnyKernel3"

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex \
            git gnupg libncurses5-dev libssl-dev \
            lzop rsync squashfs-tools xz-utils zip zlib1g-dev \
            python3

      - name: 📦 Cache Clang Toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: toolchain/clang-${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}-v4

      - name: 🛠️ Download Clang with Retry (if not cached)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          cd toolchain
          CLANG_URL="https://github.com/android-linux-stable/clang/releases/download/${CLANG_VERSION}/clang-${CLANG_VERSION}.tar.xz"
          echo "📥 Downloading Clang ${CLANG_VERSION} from: $CLANG_URL"
          
          # 尝试最多 3 次，避免临时网络失败
          for i in {1..3}; do
            echo "Attempt $i..."
            if curl -fL --progress-bar -o clang.tar.xz "$CLANG_URL"; then
              echo "✅ Download successful!"
              break
            else
              echo "❌ Download failed, retrying in 5s..."
              sleep 5
            fi
            if [ $i -eq 3 ]; then
              echo "💥 All retries failed. Exiting."
              exit 1
            fi
          done

          mkdir -p clang-${CLANG_VERSION}
          tar -xf clang.tar.xz -C clang-${CLANG_VERSION} --strip-components=1
          cd ..

      - name: 🔧 Set Environment
        run: |
          echo "${{ github.workspace }}/toolchain/clang-${{ env.CLANG_VERSION }}/bin" >> $GITHUB_PATH
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Whiteink" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=GitHub" >> $GITHUB_ENV

      - name: 🔍 Verify Clang
        run: |
          clang --version

      - name: 🧹 Clean & Configure
        run: |
          make O=out clean
          make O=out mrproper
          make O=out ${{ env.DEFCONFIG }}

      - name: ⚡ Compile Kernel
        run: |
          BUILD_START=$(date +"%s")
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-${KERNEL_NAME}"
          BUILD_END=$(date +"%s")
          echo "✅ Build time: $((BUILD_END - BUILD_START)) seconds"

      - name: 📤 Copy Kernel Image
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb
          ls -lh Image.gz-dtb

      - name: 📦 Package with AnyKernel3
        run: |
          git clone $ANYKERNEL_URL
          cp Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="${KERNEL_NAME}-${DEVICE}.zip"
          zip -r9 "../$ZIP_NAME" .
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          cd ..

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DEVICE }}
          path: |
            *.zip
            Image.gz-dtb

      - name: 🚀 Create Release (manual or main branch)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          tag_name: v$(date +%Y%m%d)
          name: "Build $(date +%Y-%m-%d)"
          body: "Kernel: `${{ env.KERNEL_NAME }}` for `${{ env.DEVICE }}`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
